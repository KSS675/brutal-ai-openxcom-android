name: Build Android APK for ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Git submodule for Android branch
      run: |
        git submodule update --init --recursive
        if [ -d "app/src/main/jni/OpenXcom" ]; then
          cd app/src/main/jni/OpenXcom
          git checkout origin/Android
          cd ../../../../..
        fi

    - name: Setup JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Accept Android licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Install Android platforms and build tools
      run: |
        sdkmanager "platforms;android-28" "build-tools;30.0.3" "platform-tools"

    - name: Download Android NDK 18b
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r18b-linux-x86_64.zip
        unzip -q android-ndk-r18b-linux-x86_64.zip
        mv android-ndk-r18b $ANDROID_HOME/ndk-bundle

    - name: Create local.properties file
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties

    - name: Setup ARM64 only build
      run: |
        # Устанавливаем фильтр только для ARM64
        echo "android.defaultConfig.ndk.abiFilters = ['arm64-v8a']" >> app/build.gradle

    - name: Fix SDL1/SDL2 compatibility issues
      run: |
        # Исправляем проблему с SDL1 и SDL2
        SDL_MIXER_H="app/src/main/jni/SDL2_mixer/SDL_mixer.h"
        if [ -f "$SDL_MIXER_H" ]; then
          sed -i 's/#include "SDL.h"/#include "SDL2\/SDL.h"/g' "$SDL_MIXER_H"
        fi
        
        SDL_IMAGE_H="app/src/main/jni/SDL2_image/SDL_image.h"
        if [ -f "$SDL_IMAGE_H" ]; then
          sed -i 's/#include "SDL.h"/#include "SDL2\/SDL.h"/g' "$SDL_IMAGE_H"
        fi

    - name: Fix warnings in BrutalAI
      run: |
        # Закомментируем неиспользуемые строки в AIModule.cpp
        AIMODULE_CPP="app/src/main/jni/OpenXcom/src/Battlescape/AIModule.cpp"
        if [ -f "$AIMODULE_CPP" ]; then
          sed -i '5032s/cost\[j\]\.Time;/\/\/ cost[j].Time;/' "$AIMODULE_CPP"
          sed -i '5033s/cost\[j\]\.Energy;/\/\/ cost[j].Energy;/' "$AIMODULE_CPP"
        fi

    - name: Fix deprecated variable names in Screen.cpp
      run: |
        SCREEN_CPP="app/src/main/jni/OpenXcom/src/Engine/Screen.cpp"
        if [ -f "$SCREEN_CPP" ]; then
          echo "Исправляем устаревшие имена переменных в Screen.cpp..."
          
          # Заменяем устаревшие имена переменных на новые
          sed -i 's/Options::useNearestScaler/Options::newNearestScaler/g' "$SCREEN_CPP"
          sed -i 's/Options::useLinearScaler/Options::newLinearScaler/g' "$SCREEN_CPP"
          sed -i 's/Options::useAnisotropicScaler/Options::newAnisotropicScaler/g' "$SCREEN_CPP"
          
          # Заменяем useSoftwareRenderer на false, так как переменная больше не существует
          sed -i 's/if (Options::useSoftwareRenderer)/if (false)/g' "$SCREEN_CPP"
          
          echo "Исправления применены!"
        else
          echo "Файл $SCREEN_CPP не найден!"
        fi

    - name: Fix deprecated variable names in Options.cpp
      run: |
        OPTIONS_CPP="app/src/main/jni/OpenXcom/src/Engine/Options.cpp"
        if [ -f "$OPTIONS_CPP" ]; then
          echo "Исправляем устаревшие имена переменных в Options.cpp..."
          
          # Создаем резервную копию
          cp "$OPTIONS_CPP" "$OPTIONS_CPP.backup"
          
          # Исправляем первые 4 строки с OptionInfo
          sed -i 's/&useNearestScaler/\&newNearestScaler/g' "$OPTIONS_CPP"
          sed -i 's/&useLinearScaler/\&newLinearScaler/g' "$OPTIONS_CPP"
          sed -i 's/&useAnisotropicScaler/\&newAnisotropicScaler/g' "$OPTIONS_CPP"
          
          # Закомментируем строку с useSoftwareRenderer
          sed -i '/useSoftwareRenderer/s/^/\/\//' "$OPTIONS_CPP"
          
          # Закомментируем бессмысленные присваивания
          sed -i '/Options::newNearestScaler = Options::useNearestScaler/s/^/\/\//' "$OPTIONS_CPP"
          sed -i '/Options::newLinearScaler = Options::useLinearScaler/s/^/\/\//' "$OPTIONS_CPP"
          sed -i '/Options::newAnisotropicScaler = Options::useAnisotropicScaler/s/^/\/\//' "$OPTIONS_CPP"
          
          # Закомментируем бессмысленные swap
          sed -i '/std::swap(useNearestScaler/s/^/\/\//' "$OPTIONS_CPP"
          sed -i '/std::swap(useLinearScaler/s/^/\/\//' "$OPTIONS_CPP"
          sed -i '/std::swap(useAnisotropicScaler/s/^/\/\//' "$OPTIONS_CPP"
          
          echo "Исправления применены!"
        else
          echo "Файл $OPTIONS_CPP не найден!"
        fi

    - name: Disable warnings as errors
      run: |
        cd app
        if [ -f "build.gradle" ]; then
          # Добавляем флаги для отключения предупреждений как ошибок
          sed -i '/cppFlags/ s/"-Werror"/"-Wno-error=unused-value -Wno-error=dangling-else -Wno-error -Wno-error=unknown-attributes -Wno-error=#warnings"/' build.gradle || true
          sed -i '/cppFlags/ s/""/"-Wno-error=unused-value -Wno-error=dangling-else -Wno-error -Wno-error=unknown-attributes -Wno-error=#warnings"/' build.gradle || true
          
          # Также добавляем флаги для отключения конкретных предупреждений
          echo "externalNativeBuild {" >> build.gradle
          echo "    cmake {" >> build.gradle
          echo "        cppFlags '-Wno-error=unknown-attributes -Wno-error=#warnings'" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle
        fi
        
    - name: Clean previous builds
      run: |
        ./gradlew clean || true
        
    - name: Build with Gradle (ARM64 only)
      run: |
        echo "Собираем APK ТОЛЬКО для ARM64..."
        
        # Устанавливаем конкретную версию Gradle wrapper
        sed -i 's/gradle-.*-bin.zip/gradle-4.10.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
        
        # Даем права на выполнение
        chmod +x gradlew
        
        # Собираем Release APK с явным указанием архитектуры
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=arm64-v8a \
          --no-daemon \
          --stacktrace \
          --info
        
    - name: Verify APK architecture
      run: |
        echo "Проверяем архитектуру собранного APK..."
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
        
        if [ -f "$APK_FILE" ]; then
          echo "Найден APK: $APK_FILE"
          
          # Проверяем размер файла
          ls -lh "$APK_FILE"
          
          # Проверяем содержимое APK на наличие нативных библиотек
          if unzip -l "$APK_FILE" | grep -q "lib/arm64-v8a"; then
            echo "✓ APK содержит библиотеки для arm64-v8a"
          else
            echo "✗ APK НЕ содержит библиотеки для arm64-v8a"
          fi
          
          # Проверяем, нет ли других архитектур
          if unzip -l "$APK_FILE" | grep -q "lib/armeabi\|lib/armeabi-v7a\|lib/x86\|lib/x86_64\|lib/mips"; then
            echo "✗ APK содержит библиотеки для других архитектур!"
            unzip -l "$APK_FILE" | grep "lib/"
          else
            echo "✓ APK содержит ТОЛЬКО arm64-v8a"
          fi
        else
          echo "APK файл не найден!"
          find . -name "*.apk" -type f
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrutalAI-Android-ARM64-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
