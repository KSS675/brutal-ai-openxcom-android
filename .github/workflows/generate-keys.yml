name: Generate Android Keystore for BrutalAI

on:
  workflow_dispatch:  # Только ручной запуск

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Generate Keystore
      run: |
        echo "=== ГЕНЕРАЦИЯ KEYSTORE ДЛЯ BRUTALAI ==="
        echo ""
        
        # Генерируем случайные пароли
        STORE_PASS=$(openssl rand -base64 12)
        KEY_PASS=$(openssl rand -base64 12)
        ALIAS_NAME="brutalai-alias"
        
        echo "Пароли сгенерированы автоматически:"
        echo "----------------------------------------"
        echo "KEYSTORE_PASSWORD: $STORE_PASS"
        echo "KEY_PASSWORD: $KEY_PASS"
        echo "KEY_ALIAS: $ALIAS_NAME"
        echo "----------------------------------------"
        echo ""
        
        # Создаем keystore
        keytool -genkey -v \
          -keystore brutalai-release.jks \
          -alias "$ALIAS_NAME" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=BrutalAI, OU=Android, O=BrutalAI, L=Unknown, ST=Unknown, C=US" \
          -storepass "$STORE_PASS" \
          -keypass "$KEY_PASS"
        
        # Конвертируем в base64
        openssl base64 -in brutalai-release.jks -A > keystore_base64.txt
        
        echo "✅ Keystore создан!"
        echo ""
        
    - name: Display Keystore Info
      run: |
        echo "=== ИНФОРМАЦИЯ ДЛЯ КОПИРОВАНИЯ ==="
        echo ""
        
        # Показываем содержимое base64
        echo "📋 KEYSTORE_BASE64 (скопируйте ВСЮ строку ниже):"
        echo "----------------------------------------"
        cat keystore_base64.txt
        echo ""
        echo "----------------------------------------"
        echo ""
        
        # Показываем пароли еще раз
        echo "🔑 Пароли (сохраните их!):"
        echo "- KEYSTORE_PASSWORD: $(keytool -list -keystore brutalai-release.jks -storepass dummy 2>&1 | grep 'KEYSTORE_PASSWORD' || echo 'см. выше')"
        echo "- KEY_PASSWORD: $(keytool -list -keystore brutalai-release.jks -storepass dummy 2>&1 | grep 'KEY_PASSWORD' || echo 'см. выше')"
        echo "- KEY_ALIAS: brutalai-alias"
        echo ""
        
    - name: Create Setup Instructions
      run: |
        echo "=== ИНСТРУКЦИЯ ==="
        echo ""
        echo "1. 📋 Скопируйте ВСЮ строку KEYSTORE_BASE64 (выше)"
        echo "2. 🔑 Запомните/запишите 3 значения:"
        echo "   - KEYSTORE_PASSWORD: (пароль из вывода выше)"
        echo "   - KEY_PASSWORD: (пароль из вывода выше)"  
        echo "   - KEY_ALIAS: brutalai-alias"
        echo ""
        echo "3. 🌐 Перейдите в настройки GitHub:"
        echo "   Ваш репозиторий → Settings → Secrets and variables → Actions"
        echo ""
        echo "4. ➕ Добавьте 4 секрета:"
        echo "   - KEYSTORE_BASE64: вставьте скопированную строку"
        echo "   - KEYSTORE_PASSWORD: введите пароль"
        echo "   - KEY_ALIAS: brutalai-alias"
        echo "   - KEY_PASSWORD: введите пароль ключа"
        echo ""
        echo "5. 🚀 Запустите основной workflow для сборки APK!"
        echo ""
        echo "⚠️ ВАЖНО: Сохраните пароли! Если потеряете, не сможете обновлять приложение."
        
    - name: Upload Keystore as Artifact (опционально)
      uses: actions/upload-artifact@v4
      with:
        name: generated-keystore
        path: |
          brutalai-release.jks
          keystore_base64.txt
        retention-days: 1  # Удалится через 1 день
