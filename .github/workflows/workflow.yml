name: Build BrutalAI Android APK (arm64-v8a only)

on:
  push:
    branches: [ brutal-ai ]
  pull_request:
    branches: [ brutal-ai ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: brutal-ai
        
    - name: List directory contents
      run: |
        echo "Содержимое директории:"
        ls -la
        echo "Содержимое app/src/main/jni:"
        ls -la app/src/main/jni/ || echo "Папка не найдена"
        
    - name: Configure Git submodule to android branch
      run: |
        echo "Проверяем наличие подмодуля OpenXcom в app/src/main/jni..."
        if [ -d "app/src/main/jni/OpenXcom" ]; then
          echo "Переключаем сабмодуль на ветку android..."
          cd app/src/main/jni/OpenXcom
          git checkout android
          git pull origin android
          cd ../../../../..
        else
          echo "ОШИБКА: Подмодуль OpenXcom не найден!"
          echo "Содержимое app/src/main/jni:"
          ls -la app/src/main/jni/
          exit 1
        fi
        
    - name: Set up JDK 8
      run: |
        echo "Устанавливаем Java 8..."
        sudo apt-get update
        sudo apt-get install -y openjdk-8-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Setup Android SDK
      run: |
        echo "Устанавливаем Android SDK..."
        cd $HOME
        mkdir -p android-sdk
        cd android-sdk
        wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
        unzip -q sdk-tools-linux-4333796.zip
        rm sdk-tools-linux-4333796.zip
        
        # Даем права на выполнение
        chmod -R +x tools/bin/
        
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
        
    - name: Accept Android licenses
      run: |
        echo "Принимаем лицензии Android SDK..."
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        
    - name: Install Android platforms and build-tools
      run: |
        echo "Устанавливаем Android platform 28 и build-tools 28.0.3..."
        $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-28" "platform-tools" "build-tools;28.0.3"
        
    - name: Download Android NDK 18b
      run: |
        echo "Скачиваем Android NDK 18b..."
        cd $HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r18b-linux-x86_64.zip
        unzip -q android-ndk-r18b-linux-x86_64.zip
        rm android-ndk-r18b-linux-x86_64.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV
        
    - name: Create local.properties
      run: |
        echo "Создаем local.properties..."
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        cat local.properties
        
    - name: Setup signing keystore
      run: |
        echo "Настраиваем подпись приложения..."
        # Создаем директорию для keystore
        mkdir -p signing
        
        # Декодируем keystore из base64
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing/brutalai.jks
        
        # Проверяем, что keystore создан
        if [ -f "signing/brutalai.jks" ]; then
          echo "Keystore успешно создан"
          ls -la signing/
        else
          echo "ОШИБКА: Не удалось создать keystore"
          exit 1
        fi
        
        # Создаем файл с паролями для gradle
        echo "Создаем signing.properties..."
        echo "storeFile=signing/brutalai.jks" > signing.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> signing.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> signing.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> signing.properties
        
    - name: Fix app/build.gradle syntax and add signing
      run: |
        echo "Исправляем синтаксис build.gradle и добавляем подпись..."
        if [ -f "app/build.gradle" ]; then
          echo "Создаем резервную копию build.gradle..."
          cp app/build.gradle app/build.gradle.backup
          
          echo "Проверяем текущий build.gradle..."
          echo "=== Первые 30 строк build.gradle ==="
          head -30 app/build.gradle
          echo "==================================="
          
          # Создаем новый build.gradle с подписью
          echo "Создаем новый build.gradle с настройками подписи..."
          
          # Читаем существующий файл и проверяем, есть ли уже блок signingConfigs
          if grep -q "signingConfigs" app/build.gradle; then
            echo "В build.gradle уже есть signingConfigs, заменяем..."
            # Удаляем старый блок signingConfigs если есть
            sed -i '/signingConfigs {/,/}/d' app/build.gradle
          fi
          
          # Создаем новый build.gradle с правильной структурой
          cat > app/build.gradle << 'GRADLE_SCRIPT'
apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"
    
    // Настройки подписи
    signingConfigs {
        release {
            def signingProps = new Properties()
            def signingFile = file('../signing.properties')
            if (signingFile.exists()) {
                signingProps.load(new FileInputStream(signingFile))
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            } else {
                println "WARNING: signing.properties not found, using debug signing"
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "org.openxcom"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.10.2"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
GRADLE_SCRIPT
          
          echo "=== Исправленный build.gradle ==="
          cat app/build.gradle
        else
          echo "app/build.gradle не найден, создаем новый с подписью..."
          mkdir -p app
          
          cat > app/build.gradle << 'GRADLE_SCRIPT'
apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"
    
    // Настройки подписи
    signingConfigs {
        release {
            def signingProps = new Properties()
            def signingFile = file('../signing.properties')
            if (signingFile.exists()) {
                signingProps.load(new FileInputStream(signingFile))
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            } else {
                println "WARNING: signing.properties not found, using debug signing"
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "org.openxcom"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.10.2"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
GRADLE_SCRIPT
        fi
        
    - name: Fix testOnly in gradle.properties
      run: |
        echo "android.injected.testOnly=false" > gradle.properties
        echo "android.testOnly=false" >> gradle.properties
        
    - name: Create gradle.properties for arm64
      run: |
        echo "Создаем gradle.properties для arm64-v8a..."
        echo "android.useDeprecatedNdk=true" > app/gradle.properties
        echo "android.bundle.enableUncompressedNativeLibs=false" >> app/gradle.properties
        
    - name: Create Application.mk for arm64
      run: |
        echo "Создаем Application.mk для arm64-v8a..."
        mkdir -p app/src/main/jni
        echo "APP_ABI := arm64-v8a" > app/src/main/jni/Application.mk
        echo "APP_PLATFORM := android-21" >> app/src/main/jni/Application.mk
        echo "APP_STL := c++_static" >> app/src/main/jni/Application.mk
        echo "APP_CPPFLAGS := -std=c++11 -frtti -fexceptions -Wno-error=unused-value -Wno-error=dangling-else" >> app/src/main/jni/Application.mk
        
    - name: Fix SDL1 to SDL2 compatibility issues
      run: |
        echo "Исправляем проблемы совместимости SDL1 и SDL2..."
        cd app/src/main/jni/OpenXcom
        
        # 1. Исправляем SDLKey на SDL_Keycode
        echo "Исправляем SDLKey на SDL_Keycode..."
        find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.inc" \) -exec sed -i 's/SDLKey/SDL_Keycode/g' {} \;
        
        # 2. Исправляем SDL_BUTTON_WHEELUP и SDL_BUTTON_WHEELDOWN
        echo "Исправляем кнопки колесика мыши..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELUP/4/g' {} \;
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELDOWN/5/g' {} \;
        
        # 3. Исправляем SDL_WarpMouse
        echo "Исправляем SDL_WarpMouse..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_WarpMouse(/SDL_WarpMouseInWindow(NULL, /g' {} \;
        
        echo "Проверяем исправления..."
        echo "Найдены SDL_Keycode:"
        grep -r "SDL_Keycode" . --include="*.cpp" --include="*.h" | wc -l
        
    - name: Fix warnings in BrutalAI
      run: |
        echo "Исправляем предупреждения компилятора..."
        cd app/src/main/jni/OpenXcom
        
        # Восстанавливаем оригинальный макрос Log в Logger.h
        echo "Восстанавливаем оригинальный макрос Log..."
        if [ -f "src/Engine/Logger.h" ]; then
          sed -i 's/#define Log(level) do { if (level <= Logger::reportingLevel()) { Logger().get(level); } } while (0)/#define Log(level) if (level > Logger::reportingLevel()) { } else Logger().get(level)/' src/Engine/Logger.h || true
          echo "Logger.h восстановлен"
        else
          echo "Logger.h не найден"
        fi
        
        # Закомментируем неиспользуемые строки в AIModule.cpp
        echo "Закомментируем неиспользуемые значения в AIModule.cpp..."
        if [ -f "src/Battlescape/AIModule.cpp" ]; then
          sed -i '5032s/cost\[j\]\.Time;/\/\/ cost[j].Time;/' src/Battlescape/AIModule.cpp
          sed -i '5033s/cost\[j\]\.Energy;/\/\/ cost[j].Energy;/' src/Battlescape/AIModule.cpp
          echo "AIModule.cpp исправлен"
        else
          echo "AIModule.cpp не найден"
        fi
        
    - name: Update gradle wrapper
      run: |
        echo "Обновляем Gradle wrapper до 4.10.3..."
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/gradle-.*-bin.zip/gradle-4.10.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper обновлен"
        else
          echo "gradle-wrapper.properties не найден, создаем..."
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-4.10.3-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        fi
        
    - name: Build with Gradle
      run: |
        echo "Собираем подписанный релизный APK с Gradle..."
        
        # Даем права на выполнение
        chmod +x gradlew
        
        # Проверяем конфигурацию Gradle
        echo "Проверяем Gradle конфигурацию..."
        ./gradlew --version
        
        # Очищаем и собираем
        echo "Начинаем сборку APK..."
        ./gradlew clean
        
        echo "Собираем Release APK для arm64-v8a с подписью..."
        ./gradlew assembleRelease \
          --no-daemon \
          --stacktrace \
          -Pandroid.injected.build.abi=arm64-v8a \
          -Pandroid.injected.signing.store.file=$(pwd)/signing/brutalai.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
        
    - name: Check build results
      run: |
        echo "Проверяем результаты сборки..."
        if [ -d "app/build/outputs/apk" ]; then
          echo "Найденные APK файлы:"
          find app/build/outputs/apk -name "*.apk" -type f | xargs ls -la
          
          # Проверяем, подписан ли APK
          echo "Проверяем подпись APK..."
          for apk in $(find app/build/outputs/apk/release -name "*.apk" -type f); do
            echo "Проверяем подпись $apk..."
            jarsigner -verify -verbose "$apk" && echo "✅ APK подписан корректно" || echo "❌ Ошибка подписи APK"
          done
          
          if [ $(find app/build/outputs/apk -name "*.apk" -type f | wc -l) -eq 0 ]; then
            echo "ОШИБКА: APK файлы не собраны!"
            echo "Содержимое app/build/outputs/apk:"
            ls -la app/build/outputs/apk/
            exit 1
          fi
        else
          echo "ОШИБКА: Папка app/build/outputs/apk не существует!"
          echo "Содержимое app/build:"
          ls -la app/build/
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrutalAI-Android-Signed-APK-arm64
        path: app/build/outputs/apk/**/*release*.apk
        retention-days: 7
