name: Build BrutalAI Android APK (ARM64 only)

on:
  push:
    branches: [ brutal-ai ]
  pull_request:
    branches: [ brutal-ai ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: brutal-ai
        
    - name: Configure Git submodule to android branch
      run: |
        if [ -d "app/src/main/jni/OpenXcom" ]; then
          cd app/src/main/jni/OpenXcom
          git checkout android
          git pull origin android
          cd ../../../../..
        else
          echo "ОШИБКА: Подмодуль OpenXcom не найден!"
          exit 1
        fi
        
    - name: Set up JDK 8
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-8-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Setup Android SDK
      run: |
        cd $HOME
        mkdir -p android-sdk
        cd android-sdk
        wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
        unzip -q sdk-tools-linux-4333796.zip
        rm sdk-tools-linux-4333796.zip
        chmod -R +x tools/bin/
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
        
    - name: Accept Android licenses
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        
    - name: Install Android platforms and build-tools
      run: |
        $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-28" "platform-tools" "build-tools;28.0.3"
        
    - name: Download Android NDK 18b
      run: |
        cd $HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r18b-linux-x86_64.zip
        unzip -q android-ndk-r18b-linux-x86_64.zip
        rm android-ndk-r18b-linux-x86_64.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        
    - name: Configure build for ARM64 only
      run: |
        echo "Настраиваем сборку ТОЛЬКО для arm64-v8a..."
        
        # 1. Создаем Application.mk с указанием только ARM64
        mkdir -p app/src/main/jni
        echo "APP_ABI := arm64-v8a" > app/src/main/jni/Application.mk
        echo "APP_PLATFORM := android-21" >> app/src/main/jni/Application.mk
        
        # 2. Модифицируем build.gradle для сборки только ARM64
        cd app
        
        # Удаляем все abiFilters и оставляем только arm64-v8a
        if [ -f "build.gradle" ]; then
          # Удаляем все старые настройки abiFilters
          sed -i '/abiFilters/d' build.gradle
          
          # Добавляем настройки для ndk (если используется ndk)
          sed -i '/ndk {/!b;n;c\            abiFilters "arm64-v8a"' build.gradle 2>/dev/null || true
          
          # Добавляем настройки для externalNativeBuild (если используется CMake)
          sed -i '/externalNativeBuild/,/}/{/cmake {/,/}/s/abiFilters.*/abiFilters "arm64-v8a"/}' build.gradle 2>/dev/null || true
          
          # Если нет блока ndk, добавляем его в defaultConfig
          if ! grep -q "ndk {" build.gradle; then
            sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a"\n        }' build.gradle
          fi
        fi
        
        # 3. Создаем gradle.properties с настройками
        echo "android.useDeprecatedNdk=true" > gradle.properties
        echo "android.bundle.enableUncompressedNativeLibs=false" >> gradle.properties
        
        cd ..
        
    - name: Fix SDL1 to SDL2 compatibility issues
      run: |
        cd app/src/main/jni/OpenXcom
        find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.inc" \) -exec sed -i 's/SDLKey/SDL_Keycode/g' {} \;
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELUP/4/g' {} \;
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELDOWN/5/g' {} \;
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_WarpMouse(/SDL_WarpMouseInWindow(NULL, /g' {} \;
        
    - name: Fix warnings in BrutalAI
      run: |
        cd app/src/main/jni/OpenXcom
        
        # Восстанавливаем оригинальный макрос Log
        if [ -f "src/Engine/Logger.h" ]; then
          sed -i '69s/#define Log(level) do { if (level <= Logger::reportingLevel()) { Logger().get(level); } } while (0)/#define Log(level) if (level > Logger::reportingLevel()) { } else Logger().get(level)/' src/Engine/Logger.h || true
        fi
        
        # Закомментируем неиспользуемые строки в AIModule.cpp
        if [ -f "src/Battlescape/AIModule.cpp" ]; then
          sed -i '5032s/cost\[j\]\.Time;/\/\/ cost[j].Time;/' src/Battlescape/AIModule.cpp
          sed -i '5033s/cost\[j\]\.Energy;/\/\/ cost[j].Energy;/' src/Battlescape/AIModule.cpp
        fi
        
    - name: Disable warnings as errors
      run: |
        cd app
        if [ -f "build.gradle" ]; then
          # Добавляем флаги для отключения предупреждений как ошибок
          sed -i '/cppFlags/ s/"-Werror"/"-Wno-error=unused-value -Wno-error=dangling-else -Wno-error"/' build.gradle || true
          sed -i '/cppFlags/ s/""/"-Wno-error=unused-value -Wno-error=dangling-else -Wno-error"/' build.gradle || true
        fi
        
    - name: Clean previous builds
      run: |
        ./gradlew clean || true
        
    - name: Build with Gradle (ARM64 only)
      run: |
        echo "Собираем APK ТОЛЬКО для ARM64..."
        
        # Устанавливаем конкретную версию Gradle wrapper
        sed -i 's/gradle-.*-bin.zip/gradle-4.10.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
        
        # Даем права на выполнение
        chmod +x gradlew
        
        # Собираем Release APK с явным указанием архитектуры
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=arm64-v8a \
          --no-daemon \
          --stacktrace \
          --info
        
    - name: Verify APK architecture
      run: |
        echo "Проверяем архитектуру собранного APK..."
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
        
        if [ -f "$APK_FILE" ]; then
          echo "Найден APK: $APK_FILE"
          
          # Проверяем размер файла
          ls -lh "$APK_FILE"
          
          # Проверяем содержимое APK на наличие нативных библиотек
          if unzip -l "$APK_FILE" | grep -q "lib/arm64-v8a"; then
            echo "✓ APK содержит библиотеки для arm64-v8a"
          else
            echo "✗ APK НЕ содержит библиотеки для arm64-v8a"
          fi
          
          # Проверяем, нет ли других архитектур
          if unzip -l "$APK_FILE" | grep -q "lib/armeabi\|lib/armeabi-v7a\|lib/x86\|lib/x86_64\|lib/mips"; then
            echo "✗ APK содержит библиотеки для других архитектур!"
            unzip -l "$APK_FILE" | grep "lib/"
          else
            echo "✓ APK содержит ТОЛЬКО arm64-v8a"
          fi
        else
          echo "APK файл не найден!"
          find . -name "*.apk" -type f
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrutalAI-Android-ARM64-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
