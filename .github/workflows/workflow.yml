name: Build BrutalAI Android APK (arm64-v8a only)

on:
  push:
    branches: [ brutal-ai ]
  pull_request:
    branches: [ brutal-ai ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: brutal-ai
        
    - name: List directory contents
      run: |
        echo "Содержимое директории:"
        ls -la
        echo "Содержимое app/src/main/jni:"
        ls -la app/src/main/jni/ || echo "Папка не найдена"
        
    - name: Configure Git submodule to android branch
      run: |
        echo "Проверяем наличие подмодуля OpenXcom в app/src/main/jni..."
        if [ -d "app/src/main/jni/OpenXcom" ]; then
          echo "Переключаем сабмодуль на ветку android..."
          cd app/src/main/jni/OpenXcom
          git checkout android
          git pull origin android
          cd ../../../../..
        else
          echo "ОШИБКА: Подмодуль OpenXcom не найден!"
          echo "Содержимое app/src/main/jni:"
          ls -la app/src/main/jni/
          exit 1
        fi
        
    - name: Set up JDK 8
      run: |
        echo "Устанавливаем Java 8..."
        sudo apt-get update
        sudo apt-get install -y openjdk-8-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Setup Android SDK
      run: |
        echo "Устанавливаем Android SDK..."
        cd $HOME
        mkdir -p android-sdk
        cd android-sdk
        wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
        unzip -q sdk-tools-linux-4333796.zip
        rm sdk-tools-linux-4333796.zip
        
        # Даем права на выполнение
        chmod -R +x tools/bin/
        
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
        
    - name: Accept Android licenses
      run: |
        echo "Принимаем лицензии Android SDK..."
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        
    - name: Install Android platforms and build-tools
      run: |
        echo "Устанавливаем Android platform 28 и build-tools 28.0.3..."
        $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-28" "platform-tools" "build-tools;28.0.3"
        
    - name: Download Android NDK 18b
      run: |
        echo "Скачиваем Android NDK 18b..."
        cd $HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r18b-linux-x86_64.zip
        unzip -q android-ndk-r18b-linux-x86_64.zip
        rm android-ndk-r18b-linux-x86_64.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV
        
    - name: Create local.properties
      run: |
        echo "Создаем local.properties..."
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        echo "Содержимое local.properties:"
        cat local.properties
        
    - name: Fix testOnly in gradle.properties
      run: |
        echo "Исправляем testOnly в gradle.properties..."
        echo "android.injected.testOnly=false" > gradle.properties
        echo "android.testOnly=false" >> gradle.properties
        echo "Содержимое gradle.properties:"
        cat gradle.properties
        
    - name: Create debug keystore for signing
      run: |
        echo "Создаем debug keystore для подписи APK..."
        mkdir -p ~/.android || true
        keytool -genkey -v -keystore ~/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Create proper build.gradle
      run: |
        echo "Создаем правильный build.gradle с подписью debug..."
        mkdir -p app
        
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "" >> app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    compileSdkVersion 28" >> app/build.gradle
        echo "    buildToolsVersion \"28.0.3\"" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    defaultConfig {" >> app/build.gradle
        echo "        applicationId \"org.openxcom\"" >> app/build.gradle
        echo "        minSdkVersion 16" >> app/build.gradle
        echo "        targetSdkVersion 28" >> app/build.gradle
        echo "        versionCode 1" >> app/build.gradle
        echo "        versionName \"1.0\"" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "        ndk {" >> app/build.gradle
        echo "            abiFilters \"arm64-v8a\"" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    signingConfigs {" >> app/build.gradle
        echo "        debug {" >> app/build.gradle
        echo "            storeFile file('\$System.env.HOME/.android/debug.keystore')" >> app/build.gradle
        echo "            storePassword 'android'" >> app/build.gradle
        echo "            keyAlias 'androiddebugkey'" >> app/build.gradle
        echo "            keyPassword 'android'" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "        release {" >> app/build.gradle
        echo "            storeFile file('\$System.env.HOME/.android/debug.keystore')" >> app/build.gradle
        echo "            storePassword 'android'" >> app/build.gradle
        echo "            keyAlias 'androiddebugkey'" >> app/build.gradle
        echo "            keyPassword 'android'" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    buildTypes {" >> app/build.gradle
        echo "        debug {" >> app/build.gradle
        echo "            signingConfig signingConfigs.debug" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "        release {" >> app/build.gradle
        echo "            minifyEnabled false" >> app/build.gradle
        echo "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'" >> app/build.gradle
        echo "            signingConfig signingConfigs.release" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    externalNativeBuild {" >> app/build.gradle
        echo "        cmake {" >> app/build.gradle
        echo "            path \"src/main/jni/CMakeLists.txt\"" >> app/build.gradle
        echo "            version \"3.10.2\"" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "dependencies {" >> app/build.gradle
        echo "    implementation fileTree(dir: 'libs', include: ['*.jar'])" >> app/build.gradle
        echo "}" >> app/build.gradle
        
        echo "Содержимое build.gradle:"
        cat app/build.gradle
        
    - name: Create gradle.properties for arm64
      run: |
        echo "Создаем gradle.properties для arm64-v8a..."
        echo "android.useDeprecatedNdk=true" > app/gradle.properties
        echo "android.bundle.enableUncompressedNativeLibs=false" >> app/gradle.properties
        
    - name: Create Application.mk for arm64
      run: |
        echo "Создаем Application.mk для arm64-v8a..."
        mkdir -p app/src/main/jni
        echo "APP_ABI := arm64-v8a" > app/src/main/jni/Application.mk
        echo "APP_PLATFORM := android-21" >> app/src/main/jni/Application.mk
        echo "APP_STL := c++_static" >> app/src/main/jni/Application.mk
        echo "APP_CPPFLAGS := -std=c++11 -frtti -fexceptions -Wno-error=unused-value -Wno-error=dangling-else" >> app/src/main/jni/Application.mk
        
    - name: Fix SDL1 to SDL2 compatibility issues
      run: |
        echo "Исправляем проблемы совместимости SDL1 и SDL2..."
        cd app/src/main/jni/OpenXcom
        
        # Создаем временный файл для исправления SDLKey
        echo "Исправляем SDLKey на SDL_Keycode..."
        find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.inc" \) -print0 | while IFS= read -r -d $'\0' file; do
          if grep -q "SDLKey" "$file"; then
            echo "Исправляем $file"
            cp "$file" "$file.tmp"
            tr -d '\r' < "$file.tmp" | sed 's/SDLKey/SDL_Keycode/g' > "$file"
            rm "$file.tmp"
          fi
        done
        
        # Создаем временный файл для исправления кнопок колесика мыши
        echo "Исправляем кнопки колесика мыши..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -print0 | while IFS= read -r -d $'\0' file; do
          if grep -q "SDL_BUTTON_WHEELUP\|SDL_BUTTON_WHEELDOWN" "$file"; then
            echo "Исправляем $file"
            cp "$file" "$file.tmp"
            tr -d '\r' < "$file.tmp" | sed 's/SDL_BUTTON_WHEELUP/4/g; s/SDL_BUTTON_WHEELDOWN/5/g' > "$file"
            rm "$file.tmp"
          fi
        done
        
        # Создаем временный файл для исправления SDL_WarpMouse
        echo "Исправляем SDL_WarpMouse..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -print0 | while IFS= read -r -d $'\0' file; do
          if grep -q "SDL_WarpMouse(" "$file"; then
            echo "Исправляем $file"
            cp "$file" "$file.tmp"
            tr -d '\r' < "$file.tmp" | sed 's/SDL_WarpMouse(/SDL_WarpMouseInWindow(NULL, /g' > "$file"
            rm "$file.tmp"
          fi
        done
        
        echo "Проверяем исправления..."
        echo "Найдены SDL_Keycode:"
        grep -r "SDL_Keycode" . --include="*.cpp" --include="*.h" | wc -l
        
    - name: Fix warnings in BrutalAI
      run: |
        echo "Исправляем предупреждения компилятора..."
        cd app/src/main/jni/OpenXcom
        
        # Восстанавливаем оригинальный макрос Log в Logger.h
        echo "Восстанавливаем оригинальный макрос Log..."
        if [ -f "src/Engine/Logger.h" ]; then
          echo "Создаем исправленную версию Logger.h..."
          cp src/Engine/Logger.h src/Engine/Logger.h.backup
          echo "#ifndef LOGGER_H" > src/Engine/Logger.h.tmp
          echo "#define LOGGER_H" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "#include <string>" >> src/Engine/Logger.h.tmp
          echo "#include <sstream>" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "enum TLogLevel {logERROR, logWARNING, logINFO, logDEBUG, logDEBUG1, logDEBUG2, logDEBUG3, logDEBUG4};" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "class Logger" >> src/Engine/Logger.h.tmp
          echo "{" >> src/Engine/Logger.h.tmp
          echo "public:" >> src/Engine/Logger.h.tmp
          echo "    Logger();" >> src/Engine/Logger.h.tmp
          echo "    virtual ~Logger();" >> src/Engine/Logger.h.tmp
          echo "    std::ostringstream& get(TLogLevel level = logINFO);" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "    static TLogLevel& reportingLevel();" >> src/Engine/Logger.h.tmp
          echo "    static std::string toString(TLogLevel level);" >> src/Engine/Logger.h.tmp
          echo "    static TLogLevel fromString(const std::string& level);" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "protected:" >> src/Engine/Logger.h.tmp
          echo "    std::ostringstream os;" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "private:" >> src/Engine/Logger.h.tmp
          echo "    Logger(const Logger&);" >> src/Engine/Logger.h.tmp
          echo "    Logger& operator =(const Logger&);" >> src/Engine/Logger.h.tmp
          echo "    TLogLevel messageLevel;" >> src/Engine/Logger.h.tmp
          echo "};" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "#define Log(level) \\" >> src/Engine/Logger.h.tmp
          echo "    if (level > Logger::reportingLevel()) { } \\" >> src/Engine/Logger.h.tmp
          echo "    else Logger().get(level)" >> src/Engine/Logger.h.tmp
          echo "" >> src/Engine/Logger.h.tmp
          echo "#endif // LOGGER_H" >> src/Engine/Logger.h.tmp
          
          # Сохраняем оригинальный хвост файла, если он есть
          grep -A 1000 "class Logger" src/Engine/Logger.h.backup | tail -n +30 >> src/Engine/Logger.h.tmp 2>/dev/null || true
          
          mv src/Engine/Logger.h.tmp src/Engine/Logger.h
          echo "Logger.h восстановлен"
        else
          echo "Logger.h не найден"
        fi
        
        # Закомментируем неиспользуемые строки в AIModule.cpp
        echo "Закомментируем неиспользуемые значения в AIModule.cpp..."
        if [ -f "src/Battlescape/AIModule.cpp" ]; then
          echo "Создаем исправленную версию AIModule.cpp..."
          cp src/Battlescape/AIModule.cpp src/Battlescape/AIModule.cpp.backup
          head -5031 src/Battlescape/AIModule.cpp.backup > src/Battlescape/AIModule.cpp.tmp
          echo "                                        // cost[j].Time;" >> src/Battlescape/AIModule.cpp.tmp
          echo "                                        // cost[j].Energy;" >> src/Battlescape/AIModule.cpp.tmp
          tail -n +5034 src/Battlescape/AIModule.cpp.backup >> src/Battlescape/AIModule.cpp.tmp
          mv src/Battlescape/AIModule.cpp.tmp src/Battlescape/AIModule.cpp
          echo "AIModule.cpp исправлен"
        else
          echo "AIModule.cpp не найден"
        fi
        
    - name: Update gradle wrapper
      run: |
        echo "Обновляем Gradle wrapper до 4.10.3..."
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-4.10.3-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        
        echo "Содержимое gradle-wrapper.properties:"
        cat gradle/wrapper/gradle-wrapper.properties
        
    - name: Build with Gradle
      run: |
        echo "Собираем APK с Gradle..."
        
        # Даем права на выполнение
        chmod +x gradlew
        
        # Проверяем конфигурацию Gradle
        echo "Проверяем Gradle конфигурацию..."
        ./gradlew --version
        
        # Очищаем и собираем
        echo "Начинаем сборку APK..."
        ./gradlew clean
        
        echo "Собираем Release APK для arm64-v8a с debug подписью..."
        ./gradlew assembleRelease \
          --no-daemon \
          --stacktrace \
          -Pandroid.injected.build.abi=arm64-v8a \
          -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android
        
    - name: Check build results
      run: |
        echo "Проверяем результаты сборки..."
        if [ -d "app/build/outputs/apk" ]; then
          echo "Найденные APK файлы:"
          find app/build/outputs/apk -name "*.apk" -type f | xargs ls -la
          
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f | wc -l)
          if [ $APK_COUNT -eq 0 ]; then
            echo "ОШИБКА: APK файлы не собраны!"
            echo "Содержимое app/build/outputs/apk:"
            ls -la app/build/outputs/apk/
            exit 1
          fi
        else
          echo "ОШИБКА: Папка app/build/outputs/apk не существует!"
          echo "Содержимое app/build:"
          ls -la app/build/
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrutalAI-Android-APK-arm64
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
