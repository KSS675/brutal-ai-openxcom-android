name: Build BrutalAI Android APK

on:
  push:
    branches: [ brutal-ai ]
  pull_request:
    branches: [ brutal-ai ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: brutal-ai
        
    - name: List directory contents
      run: |
        echo "Содержимое директории:"
        ls -la
        echo "Содержимое app/src/main/jni:"
        ls -la app/src/main/jni/ || echo "Папка не найдена"
        
    - name: Configure Git submodule to android branch
      run: |
        echo "Проверяем наличие подмодуля OpenXcom в app/src/main/jni..."
        if [ -d "app/src/main/jni/OpenXcom" ]; then
          echo "Переключаем сабмодуль на ветку android..."
          cd app/src/main/jni/OpenXcom
          git checkout android
          git pull origin android
          cd ../../../../..
        else
          echo "ОШИБКА: Подмодуль OpenXcom не найден!"
          echo "Содержимое app/src/main/jni:"
          ls -la app/src/main/jni/
          exit 1
        fi
        
    - name: Set up JDK 8
      run: |
        echo "Устанавливаем Java 8..."
        sudo apt-get update
        sudo apt-get install -y openjdk-8-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Setup Android SDK
      run: |
        echo "Устанавливаем Android SDK..."
        cd $HOME
        mkdir -p android-sdk
        cd android-sdk
        wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
        unzip -q sdk-tools-linux-4333796.zip
        rm sdk-tools-linux-4333796.zip
        
        # Даем права на выполнение
        chmod -R +x tools/bin/
        
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
        
    - name: Accept Android licenses
      run: |
        echo "Принимаем лицензии Android SDK..."
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        
    - name: Install Android platforms and build-tools
      run: |
        echo "Устанавливаем Android platform 28 и build-tools 28.0.3..."
        $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-28" "platform-tools" "build-tools;28.0.3"
        
    - name: Download Android NDK 18b
      run: |
        echo "Скачиваем Android NDK 18b..."
        cd $HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r18b-linux-x86_64.zip
        unzip -q android-ndk-r18b-linux-x86_64.zip
        rm android-ndk-r18b-linux-x86_64.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "NDK_HOME=$HOME/android-ndk-r18b" >> $GITHUB_ENV
        echo "PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV
        
    - name: Create local.properties
      run: |
        echo "Создаем local.properties..."
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        cat local.properties
        
    - name: Configure build for arm64-v8a only
      run: |
        echo "Настраиваем сборку только для arm64-v8a..."
        cd app
        # Создаем gradle.properties для ограничения архитектур
        echo "android.useDeprecatedNdk=true" > gradle.properties
        echo "APP_ABI=arm64-v8a" >> gradle.properties
        
        # Модифицируем build.gradle для arm64 только
        # 1. Заменяем abiFilters
        sed -i 's/abiFilters "armeabi-v7a", "x86", "x86_64", "arm64-v8a"/abiFilters "arm64-v8a"/g' build.gradle
        
        # 2. Добавляем аргумент для ANDROID_ABI в существующую строку arguments
        sed -i 's/arguments "-DANDROID_STL=c++_static", "-DANDROID_ARM_MODE=arm", "-DOPENXCOM_VERSION_STRING=\${project.revision}"/arguments "-DANDROID_STL=c++_static", "-DANDROID_ARM_MODE=arm", "-DOPENXCOM_VERSION_STRING=\${project.revision}", "-DANDROID_ABI=arm64-v8a"/g' build.gradle
        
        # 3. Добавляем флаги для отключения предупреждений
        sed -i 's/cppFlags "-std=c++17", "-fexceptions", "-frtti"/cppFlags "-std=c++17", "-fexceptions", "-frtti", "-Wno-error=unused-value", "-Wno-error=dangling-else", "-Wno-error"/g' build.gradle
        
        # 4. Проверяем изменения
        echo "Проверяем изменения в build.gradle:"
        echo "abiFilters:"
        grep -n "abiFilters" build.gradle
        echo "arguments:"
        grep -n "arguments" build.gradle | head -5
        echo "cppFlags:"
        grep -n "cppFlags" build.gradle
        cd ..
        
    - name: Fix SDL1 to SDL2 compatibility issues
      run: |
        echo "Исправляем проблемы совместимости SDL1 и SDL2..."
        cd app/src/main/jni/OpenXcom
        
        # 1. Исправляем SDLKey на SDL_Keycode
        echo "Исправляем SDLKey на SDL_Keycode..."
        find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.inc" \) -exec sed -i 's/SDLKey/SDL_Keycode/g' {} \;
        
        # 2. Исправляем SDL_BUTTON_WHEELUP и SDL_BUTTON_WHEELDOWN
        echo "Исправляем кнопки колесика мыши..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELUP/4/g' {} \;
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_BUTTON_WHEELDOWN/5/g' {} \;
        
        # 3. Исправляем SDL_WarpMouse
        echo "Исправляем SDL_WarpMouse..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_WarpMouse(/SDL_WarpMouseInWindow(NULL, /g' {} \;
        
        # 4. Исправляем SDL_WM_GrabInput для SDL2
        echo "Исправляем SDL_WM_GrabInput..."
        find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec sed -i 's/SDL_WM_GrabInput(\(.*\));/SDL_SetWindowGrab(SDL_GL_GetCurrentWindow(), \1 ? SDL_TRUE : SDL_FALSE);/g' {} \;
        
        echo "Проверяем исправления..."
        echo "Найдены SDL_Keycode:"
        grep -r "SDL_Keycode" . --include="*.cpp" --include="*.h" | wc -l
        
    - name: Fix warnings in BrutalAI
      run: |
        echo "Исправляем предупреждения компилятора..."
        cd app/src/main/jni/OpenXcom
        
        # Восстанавливаем оригинальный макрос Log в Logger.h
        echo "Восстанавливаем оригинальный макрос Log..."
        if [ -f "src/Engine/Logger.h" ]; then
          # Восстанавливаем оригинальный макрос Log на строке 69
          sed -i '69s/#define Log(level) do { if (level <= Logger::reportingLevel()) { Logger().get(level); } } while (0)/#define Log(level) if (level > Logger::reportingLevel()) { } else Logger().get(level)/' src/Engine/Logger.h || true
          
          # Проверяем, есть ли другой формат макроса
          sed -i '69s/#define Log(level) if (level <= Logger::reportingLevel()) { Logger().get(level); }/#define Log(level) if (level > Logger::reportingLevel()) { } else Logger().get(level)/' src/Engine/Logger.h || true
          echo "Logger.h восстановлен"
        else
          echo "Logger.h не найден"
        fi
        
        # Закомментируем неиспользуемые строки в AIModule.cpp
        echo "Закомментируем неиспользуемые значения в AIModule.cpp..."
        if [ -f "src/Battlescape/AIModule.cpp" ]; then
          # Закомментируем строки 5032 и 5033
          sed -i '5032s/cost\[j\]\.Time;/\/\/ cost[j].Time;/' src/Battlescape/AIModule.cpp
          sed -i '5033s/cost\[j\]\.Energy;/\/\/ cost[j].Energy;/' src/Battlescape/AIModule.cpp
          echo "AIModule.cpp исправлен"
        else
          echo "AIModule.cpp не найден"
        fi
        
    - name: Add compile options to CMakeLists
      run: |
        echo "Добавляем опции компиляции в CMakeLists.txt..."
        cd app/src/main/jni
        if [ -f "CMakeLists.txt" ]; then
          # Добавляем в начало файла
          sed -i '1iadd_compile_options(-Wno-error=unused-value -Wno-error=dangling-else -Wno-error)' CMakeLists.txt || true
          echo "CMakeLists.txt модифицирован"
        else
          echo "CMakeLists.txt не найден"
        fi
        
    - name: Check build configuration
      run: |
        echo "Проверяем конфигурацию сборки..."
        cd app
        echo "Содержимое build.gradle (важные секции):"
        grep -n -A 5 -B 5 "abiFilters" build.gradle
        echo "Содержимое gradle.properties:"
        cat gradle.properties
        echo "Содержимое local.properties:"
        cat ../local.properties
        
    - name: Build with Gradle 4.10.3
      run: |
        echo "Собираем APK с Gradle 4.10.3..."
        cd app
        
        # Устанавливаем конкретную версию Gradle wrapper
        sed -i 's/gradle-.*-bin.zip/gradle-4.10.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
        
        # Даем права на выполнение
        chmod +x gradlew
        
        # Собираем Release APK
        ./gradlew clean assembleRelease --no-daemon --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrutalAI-Android-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
        
    - name: List build outputs
      run: |
        echo "Собранные файлы:"
        find . -name "*.apk" -type f | xargs ls -la
