name: Sign APK from Direct URL

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 'Direct URL to APK file'
        required: true
        default: 'https://nightly.link/KSS675/brutal-ai-openxcom-android/actions/runs/20215425684/BrutaIAI-Android-APK-arm64.zip'

jobs:
  sign-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install Java
      run: sudo apt-get update && sudo apt-get install -y openjdk-8-jre-headless wget
      
    - name: Download and extract APK
      run: |
        # Скачиваем архив с APK
        wget -q "${{ github.event.inputs.artifact_url }}" -O artifact.zip
        
        # Распаковываем
        unzip -q artifact.zip
        
        # Ищем APK файл
        APK_FILE=$(find . -name "*.apk" -type f | head -1)
        
        if [ -z "$APK_FILE" ]; then
          echo "APK не найден в архиве!"
          ls -la
          exit 1
        fi
        
        echo "Найден APK: $APK_FILE"
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
        
    - name: Sign the APK
      run: |
        # Создаем keystore и подписываем
        keytool -genkey -noprompt \
          -keystore keystore.jks \
          -alias app \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass password \
          -keypass password \
          -dname "CN=BrutalAI"
        
        jarsigner -keystore keystore.jks \
          -storepass password \
          -keypass password \
          "${{ env.APK_FILE }}" app
        
        echo "APK подписан"
        
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: Signed-APK
        path: ${{ env.APK_FILE }}
